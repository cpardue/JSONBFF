<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>JSON BFF — Beautify, Format &amp; Fix JSON Online (Free, In-Browser)</title>
  <meta
    name="description"
    content="Free online JSON tool to validate, format/beautify, repair broken JSON (trailing commas, missing brackets, single quotes) and compact it — all in your browser, nothing uploaded."
  />

  <!-- Canonical: GitHub Pages project-site URL. Update once a custom domain is set (JSONBFF-PLAN.md §8). -->
  <link rel="canonical" href="https://cpardue.github.io/JSONBFF/" />

  <!-- Open Graph -->
  <meta property="og:title" content="JSON BFF — Beautify, Format & Fix JSON Online (Free, In-Browser)" />
  <meta
    property="og:description"
    content="Validate, beautify, repair and compact JSON right in your browser. Trailing commas, single quotes, missing brackets — fixed without uploading a byte."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cpardue.github.io/JSONBFF/" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="JSON BFF — Beautify, Format & Fix JSON Online (Free, In-Browser)" />
  <meta
    name="twitter:description"
    content="Validate, beautify, repair and compact JSON right in your browser. Nothing is uploaded."
  />

  <meta name="theme-color" content="#2563eb" />

  <!-- Structured data: JSON-LD WebApplication (JSONBFF-PLAN.md §6) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "JSON BFF — Beautify, Format & Fix",
    "description": "Free in-browser JSON tool: validate, format/beautify, repair broken JSON and compact it. 100% client-side, nothing uploaded.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any (web browser)",
    "url": "https://cpardue.github.io/JSONBFF/",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>

  <link rel="stylesheet" href="css/style.css" />

  <!-- =====================================================================
       ADSENSE — post-approval drop-in (JSONBFF-PLAN.md §6)
       After AdSense approval:
       1. Replace every ca-pub-XXXXXXXXXXXXXXXX / 0000000000 with the real IDs.
       2. Uncomment the <script> tag below.
       3. Uncomment the (adsbygoogle ... push) line next to each <ins> in the body.
       4. Remove the two local-testing hide rules at the top of css/style.css.
       Kept commented while the publisher ID is a placeholder so the site
       passes the "zero console errors" definition of done (JSONBFF-PLAN.md §11).
       ===================================================================== -->
  <!--
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
    crossorigin="anonymous"></script>
  -->

  <!-- =====================================================================
       WEBMCP origin trial (JSONBFF-PLAN.md §12) — fill in after deploy (§8).
       The WebMCP API (document.modelContext) is in Chrome/Edge origin
       trials; js/webmcp.js is a silent no-op without it, so the site works
       everywhere either way. Post-deploy:
       1. Join the WebMCP origin trial and request a token for this site's
          ORIGIN (https://cpardue.github.io — note project-site origins are
          shared across repos; a custom domain is a different origin →
          re-request the token there, §8 step 4). Tokens expire (~6 months).
       2. Uncomment the meta tag below with the real token.
       3. Verify the tools register (Model Context Tool Inspector extension,
          or document.modelContext.getTools() in DevTools).
       ===================================================================== -->
  <!-- <meta http-equiv="OriginTrial" content="REPLACE-WITH-ORIGIN-TRIAL-TOKEN" /> -->

  <!-- ANALYTICS (GA4) — same pattern as AdSense: add the gtag snippet and
       measurement ID (G-XXXXXXXXXX) after approval (JSONBFF-PLAN.md §9). -->
</head>
<body>
  <a class="skip-link" href="#main">Skip to JSON tool</a>

  <header class="site-header">
    <div class="brand">
      <span class="logo" aria-hidden="true">{ }</span>
      <span class="brand-name">JSON BFF</span>
      <span class="brand-tag" aria-hidden="true">Beautify · Format · Fix</span>
    </div>
    <nav class="site-nav" aria-label="Site">
      <a href="about.html">About</a>
    </nav>
  </header>

  <div id="ad-header" class="ad-slot ad-slot--header">
    <!-- AdSense responsive unit (top, max ~90px). After approval, uncomment the push line. -->
    <ins
      class="adsbygoogle"
      style="display:block; max-height:90px;"
      data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
      data-ad-slot="0000000000"
      data-ad-format="auto"
      data-full-width-responsive="true"></ins>
    <!-- (adsbygoogle = window.adsbygoogle || []).push({}); -->
  </div>

  <main id="main">
    <div class="toolbar" role="group" aria-label="JSON actions">
      <button type="button" class="btn" id="btn-validate" aria-label="Validate the JSON in the input pane">Validate</button>
      <button type="button" class="btn btn--primary" id="btn-format" aria-label="Format (beautify) the JSON in the input pane">Format</button>
      <button type="button" class="btn" id="btn-fix" aria-label="Fix broken JSON in the input pane">Fix</button>
      <button type="button" class="btn" id="btn-compact" aria-label="Compact the JSON to a single line">Compact</button>

      <label class="indent-picker" for="indent-select">Indent:
        <select id="indent-select" aria-label="Indent style">
          <option value="2" selected>2 spaces</option>
          <option value="4">4 spaces</option>
          <option value="tab">Tab</option>
        </select>
      </label>

      <button type="button" class="btn btn--ghost" id="btn-clear" aria-label="Clear the input and output panes">Clear</button>
    </div>

    <div class="panes">
      <section class="pane" aria-labelledby="input-label">
        <h2 class="pane-title" id="input-label">Input</h2>
        <div class="pane-body">
          <textarea
            id="json-input"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            aria-label="JSON input"
            placeholder='Paste JSON here — broken is fine. Example: {"name": "api", "items": [1, 2,],}'>
          </textarea>
        </div>
      </section>

      <section class="pane" aria-labelledby="output-label">
        <div class="output-head">
          <h2 class="pane-title" id="output-label">Output</h2>
          <div class="output-actions">
            <button type="button" class="btn btn--small" id="btn-copy" aria-label="Copy the output to the clipboard">Copy</button>
            <button type="button" class="btn btn--small" id="btn-download" aria-label="Download the output as json-formatted.json">Download .json</button>
            <button type="button" class="btn btn--small" id="btn-share" aria-label="Copy a share link containing your JSON" title="Paste some JSON first — Share copies a link that opens this page with it prefilled." disabled>Share</button>
          </div>
        </div>
        <div class="pane-body pane-body--output">
          <pre id="json-output-wrap"><code id="json-output"></code></pre>
        </div>
      </section>
    </div>

    <p id="status-bar" class="status status--info" role="status" aria-live="polite">Paste JSON on the left — it stays in your browser, nothing is uploaded.</p>
  </main>

  <div id="ad-footer" class="ad-slot ad-slot--footer">
    <!-- AdSense responsive unit (bottom). After approval, uncomment the push line. -->
    <ins
      class="adsbygoogle"
      style="display:block;"
      data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
      data-ad-slot="0000000001"
      data-ad-format="auto"
      data-full-width-responsive="true"></ins>
    <!-- (adsbygoogle = window.adsbygoogle || []).push({}); -->
  </div>

  <footer class="site-footer">
    <p class="privacy-line">100% client-side — your JSON never leaves this page (share links encode it in the URL; nothing is stored on our side).</p>
    <nav aria-label="Footer">
      <a href="about.html">About</a>
      <span aria-hidden="true">·</span>
      <a href="privacy.html">Privacy</a>
    </nav>
  </footer>

  <!-- Core actions (JSONBFF-PLAN.md §10). Load before app.js, which reads
       window.JSONBFFFormat / window.JSONBFFFix when the buttons are clicked. -->
  <script src="js/formatter.js"></script>
  <script src="js/fixer.js"></script>
  <script src="js/webmcp.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
